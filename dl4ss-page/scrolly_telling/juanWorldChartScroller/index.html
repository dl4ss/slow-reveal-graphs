<!DOCTYPE html>
<meta charset="utf-8">

<head>

    <!-- This is a template for scrolly tellers. This can
     either be for gradual progress or discrete steps. -->
    <!-- Load libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <link rel="stylesheet" href="stylesheet.css">

</head>

<body>

    <main>
        <!-- Currently unused -->
        <section id="background">

        </section>
        <section id="scrolly">

            <figure>
                <!-- 
                Add as many steps as needed.
                The nummber of content steps should match up to the number of data steps.
                The center-step tag is used by the JavaScript in the file to adjust the opacity 
                of the step.
                 -->
                <p id="contentScroll" center-step="1"><b>Juan de la Cosa's World Chart</b><br>A Virtual Tour</p>

                <p id="contentScroll" center-step="2">
                    This is a story is a story about Juan de la Cosa's 1500 World Chart, which was one of the first
                    European world maps to show North and South America across the Atlantic Ocean. As you scroll, the
                    story will progress on the left side of your screen. On the right side, you'll see images that
                    correspond with the story. Pay attention to the outlines that appear on the map. When you need more
                    time to read or look at something, simply stop scrolling. Sometimes you'll be invited to click on a
                    hyperlink, which will open a new window on your computer. We hope you'll enjoy our scrollytelling
                    about Juan de la Cosa's world map!
                </p>

                <p id="contentScroll" center-step="3" class="left-location">
                    Juan de la Cosa was a Spanish pilot and navigator who sailed to the Americas seven times, including
                    on the first three of Christopher Columbus's famous voyages.

                </p>
                <img id="contentScroll" center-step="3" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_987e71e0d5324e428f1b5a449fad8c8b~mv2.webp">

                <p id="contentScroll" center-step="4" class="left-location">
                    In fact, de la Cosa was the owner of the <i>Santa Maria</i>, one of the three ships that sailed with
                    Columbus in 1492.
                </p>
                <img id="contentScroll" center-step="4" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_90a50f2215fb435bb5cf165d2b7d291d~mv2.png">

                <p id="contentScroll" center-step="5">
                    De la Cosa most likely created his world map in 1500 for the Spanish crown, to highlight their newly
                    discovered territories in the western hemisphere. This context is important, as is what de la Cosa
                    knew, and what he didn't know. Like all maps, this map tells a story.
                    <br><br>
                    Before we continue, take some time to study the map. What do you notice? What looks familiar and
                    accurate? What looks unfamiliar or inaccurate? What do you wonder?
                    <br><br>
                    When you're ready, keep scrolling to learn more.
                </p>

                <img id="contentScroll" center-step="6"
                    src="https://static.wixstatic.com/media/5875bf_129683ba51c74d1bb2eb1629a58b7f35~mv2.webp">

                <p id="contentScroll" center-step="7" class="left-location">
                    The first thing to know about De la Cosa's map, is that he actually drew it with west facing upward,
                    as is shown by the compass rose he drew in the middle of the map

                </p>
                <img id="contentScroll" center-step="7" class="right-location vertical-map" persistent="TRUE"
                    src="https://static.wixstatic.com/media/5875bf_129683ba51c74d1bb2eb1629a58b7f35~mv2.webp">

                <p id="contentScroll" center-step="8" class="left-location">
                    One way we know that this is the orientation he intended is by the image of the person at the top of
                    the map.
                </p>

                <p id="contentScroll" center-step="9" class="left-location">
                    If you look closely, you can see it's a drawing of St. Christopher carrying the infant Jesus across
                    a river. This was clearly an homage to Christopher Columbus, as well as a reference to the religious
                    motivations behind the Spanish Crown's sponsorship of westward exploration.


                </p>
                <img id="contentScroll" center-step="9" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_494e4d68f6494bce85e965597fd58914~mv2.png">

            </figure>

            <article>
                <!-- Intentionally left blank -->
            </article>

            <figure>
                <img id="imageScroll">
            </figure>
        </section>

        <!-- Currently unused -->
        <section id="outro"></section>
    </main>

    <script>

        // This function serves as a shortcut to create the data steps without having to manually
        // create them. The actual image and text elements need to be manually created and linked
        // to the div via the center-step tag.
        function divCreator(finalNumber, stepHeight) {

            const target = document.querySelector("#scrolly > article");


            for (let dataStep = 0; dataStep < finalNumber + 1; dataStep++) {

                const newDiv = document.createElement("div");
                newDiv.classList.add("step");
                newDiv.setAttribute('data-step', dataStep);

                const spacerDiv = document.createElement("div");
                spacerDiv.classList.add("spacer");

                // Adding steps to DOM
                target.appendChild(newDiv);
                target.appendChild(spacerDiv);

                // Setting step height
                newDiv.style.height = stepHeight + "px";
                spacerDiv.style.height = "500" + "px";

            }

        }

        // Enter the number of reveal steps here! (Includes a step 0)
        divCreator(25, 500);


        // using d3 for convenience
        var main = d3.select("main");
        var scrolly = main.select("#scrolly");
        var figure = scrolly.select("figure");
        var article = scrolly.select("article");
        var step = article.selectAll(".step");
        var spacer = article.selectAll(".spacer");

        // Getting pre-defined sizes
        var centerImgSize = document.querySelector("img#contentScroll:not(.right-location)").getBoundingClientRect();
        var rightImgSize = document.querySelector("#contentScroll.right-location").getBoundingClientRect();
        var leftImgSize = document.querySelector("#contentScroll.left-location").getBoundingClientRect();
        var textSize = parseInt(window.getComputedStyle(document.querySelector("p#contentScroll")).getPropertyValue("font-size"), 10);
        var stepH = 500;


        // initialize the scrollama
        var scroller = scrollama();

        // generic window resize listener event
        function handleResize() {

            // Setting scale based on a 1920px by 911px window. Default 32pt font;

            var horizontalScale = window.innerWidth / 1920;
            var verticalScale = window.innerHeight / 911;

            // Setting step and spacer height;
            //Scrollama does not like trying to resize the step element;

            // step.style("height", stepH * verticalScale + "px");
            spacer.style("height", stepH * verticalScale + "px");

            var figureHeight = window.innerHeight / 1.5;
            var figureMarginTop = (window.innerHeight - figureHeight) / 2;

            figure
                .style("height", figureHeight + "px")
                .style("top", figureMarginTop + "px");

            // Scaling element within the figure

            // Adjusting images

            var centerImgElements = document.querySelectorAll("img#contentScroll:not(.right-location)");

            centerImgElements.forEach(element => {

                element.style.width = centerImgSize.width * horizontalScale + "px";
                element.style.height = centerImgSize.height * verticalScale + "px";

            });

            var rightImgElements = document.querySelectorAll("img#contentScroll.right-location");

            rightImgElements.forEach(element => {

                element.style.width = rightImgElements.width * horizontalScale + "px";
                element.style.height = rightImgSize.height * verticalScale + "px";

            });

            var textElements = document.querySelectorAll("p#contentScroll");

            textElements.forEach(element => {

                element.style.fontSize = textSize * verticalScale + "px";

            });

            scroller.resize();

        }

        // scrollama event handlers

        function handleStepProgress(response) {
            console.log(response);

            let opacity;

            // Defining the current element and non-current elements;
            currentElement = d3.selectAll("[center-step ='" + `${response.index}` + "']");
            allElements = d3.selectAll("#contentScroll:not([center-step ='" + `${response.index}` + "'])");

            // Selecting persistent elements
            persistentMap = d3.selectAll("[persistent = TRUE]")


            // Tagging element as current and removing tag from others
            currentElement.classed("is-current", true);
            allElements.classed("is-current", false);

            if (response.progress <= 0.33) {

                // Fade in: from 0 to 1 over the first 33%
                opacity = (response.progress) * 3;

                // opacity = 1;

            } else if (response.progress > 0.33 && response.progress < 0.66) {

                // Stay at opacity 1 between 33% and 66%
                opacity = 1;

            } else {
                // Fade out: from 1 to 0 over the last 33%
                opacity = 3 - response.progress * 3;
                // opacity = 1;

            }

            currentElement.style("opacity", opacity);


            // This is specific to this scrolly teller and works to keep the image in step 7 
            // persistent while other text changes.
            if (response.index === 7 && response.progress <= 0.33) {
                // Fade in: from 0 to 1 over the first 33%
                opacity = (response.progress) * 3;

                persistentMap.style("opacity", opacity);

            } else if (response.index === 8 && response.progress >= 0.66) {

                opacity = 3 - response.progress * 3;

                persistentMap.style("opacity", opacity);

            } else if (response.index >= 7 && response.index <= 8) {

                persistentMap.style("opacity", 1);

            } else {

                persistentMap.style("opacity", 0);
            }

            if (response.index === 7 && response.progress > 0 && response.progress < 1) {
                d3.select(".mapContainer")
                    .classed("transition", true);
            } else {

                d3.select(".mapContainer")
                    .classed("transition", false);

            }

        }

        function init() {

            // Setup resize event listener
            window.addEventListener("resize", handleResize);

            // Force a resize on load to ensure proper dimensions are sent to scrollama
            handleResize();

            // Setup the scroller passing options
            scroller
                .setup({
                    step: "#scrolly article .step",
                    offset: 0.5,
                    progress: true, // Set to false for discrete steps
                    debug: true
                })
                .onStepProgress(handleStepProgress);
        }

        // kick things off
        init();

    </script>

    <!-- Uncomment to see debugging center crosshairs  -->
    <!-- <div class="debug-crosshair"></div> -->


</body>
