            <figure>
                <p id="contentScroll" center-step="1">Ptolemy`s World Map<br>A Virtual Tour</p>

                <p id="contentScroll" center-step="2">This is a story about Claudius Ptolemy and his world map, which
                    played a
                    significant
                    role in both
                    U.S. and World history. As you scroll, the story will progress on the left side of your screen.
                    On the right side, you`ll see images that correspond with the story. Pay attention to the
                    outlines that appear on the map. When you need more time to read or look at something, simply
                    stop scrolling. Sometimes you`ll be invited to click on a hyperlink, which will open a new
                    window on your computer. We hope you`ll enjoy our scrollytelling about Ptolemy`s world map!
                </p>

                <p id="contentScroll" center-step="3" class="left-location">
                    Claudius Ptolemy, who lived from approximately 100 CE to 170 CE, was a mathematician,
                    astrologer,
                    astronomer, and
                    geographer.
                </p>
                <img id="contentScroll" center-step="3" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_ecff626ee6744eb2a947378a1ea859c5~mv2.jpg">

                <p id="contentScroll" center-step="4" class="left-location">

                    He was of Greek descent but lived in Alexandria, Egypt.

                    <br><br>

                    <b>To explore Alexandria, Egypt and Greece on Google Earth,</b>
                    <a href="https://earth.google.com/web/search/Alexandria+Egypt/@31.22533488,29.9929628,-9.19573857a,60752.08211864d,35y,-0h,0t,0r/data=Cn8aURJLCiUweDE0ZjVjNDkxMjY3MTBmZDM6MHhiNGUwY2RhNjI5ZWU2YmI5GZstakE5Mz9AIc4RnnUy6z1AKhBBbGV4YW5kcmlhIEVneXB0GAIgASImCiQJSD5gUnRQP0ARGHVpojQiP0AZiOBsWXYpPkAhMfKSdHC_PUBCAggBOgMKATBCAggASg0I____________ARAA?authuser=0"
                        target="_blank" rel="noopener noreferrer">
                        click here
                    </a>.

                </p>
                <img id="contentScroll" center-step="4" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_e6d3c0e8cf214a338d42268654209457~mv2.png">

                <p id="contentScroll" center-step="5" class="left-location">

                    Around 150 CE, Ptolemy synthesized the extensive geographic knowledge of the Greek and Roman empires
                    in the work known as <i>Geography. Geography</i> evaluated previous measurements of the earth,
                    suggested
                    methods for projecting a spherical earth onto a plane, provided a topographical account of the
                    latitude and longitude of more than 8,000 locations throughout Europe, Asia, and Africa, explained
                    the role of astronomy in geography, and provided a mathematical guide for making maps of the Earth
                    and its regions.

                </p>
                <img id="contentScroll" center-step="5" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_56c305757fe04e22934abfa855e50df2~mv2.png">

                <p id="contentScroll" center-step="6" class="left-location">

                    After its creation, <i>Geography</i> disappeared for thousands of years, only to reappear as copies
                    in 13th
                    century Byzantium, along with maps created by Byzantine scribes using the information provided by
                    Ptolemy.

                </p>
                <img id="contentScroll" center-step="6" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_c37758a022f042acb209fef17c683fc5~mv2.png">

                <p id="contentScroll" center-step="7" class="left-location">

                    The information in <i>Geography</i> would have a profound impact on mapmaking, and in the latter
                    part of
                    the 15th century, Ptolemaic maps spread across Europe, thanks in part to the newly invented printing
                    press.

                </p>
                <img id="contentScroll" center-step="7" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_b12f6797f1a1410382b998e81cb0b588~mv2.png">

                <p id="contentScroll" center-step="8" class="left-location">

                    However, <i>Geography</i>-and the maps that it influenced-contained significant inaccuracies,
                    attributable
                    in part to Ptolemy's miscalculation of the size of the Earth, which he believed was smaller than it
                    is. This, too, would have a profound impact, famously leading Christopher to believe that he could
                    sail around the world in a shorter time than was actually the case.

                </p>
                <img id="contentScroll" center-step="8" class="right-location"
                    src="https://static.wixstatic.com/media/5875bf_5276abb7c66d4307ad64efb29ac551d6~mv2.png">

                <p id="contentScroll" center-step="9">
                    The map highlighted in this story was created in the 15th century from the information Ptolemy
                    provided. Like all maps, it tells its own story-what people knew and did not know about the world at
                    the time the map was made. Before we continue take some time to study the map. What do you notice?
                    What looks familiar and accurate? What looks unfamiliar or inaccurate? What do you wonder? When
                    you're ready, keep scrolling to learn more.
                </p>

                <img id="contentScroll" center-step="10"
                    src="https://static.wixstatic.com/media/5875bf_c70161013ebe4a5384411d37824033e8~mv2.jpg">

    <script>
        // using d3 for convenience
        var main = d3.select("main");
        var scrolly = main.select("#scrolly");
        var figure = scrolly.select("figure");
        var article = scrolly.select("article");
        var step = article.selectAll(".step");
        var spacer = article.selectAll(".spacer");

        // const images = [
        //     "https://www.google.com/logos/doodles/2026/dr-martin-luther-king-jr-day-2026-6753651837110996-2x.png",
        //     "https://www.google.com/logos/doodles/2025/mothers-day-2025-dec-22-6753651837110688-2x.png",
        //     "https://www.google.com/logos/doodles/2025/thanksgiving-2025-6753651837111179.2-2x.png",
        //     "https://www.google.com/logos/doodles/2025/googles-27th-birthday-6753651837110886.2-2x.png"
        // ];

        // initialize the scrollama
        var scroller = scrollama();


        // generic window resize listener event
        function handleResize() {
            // 1. update height of step elements
            // var stepH = Math.floor(window.innerHeight * 0.75);

            var stepH = 500;
            step.style("height", stepH + "px");

            spacer.style("height", "500px");

            var figureHeight = window.innerHeight / 1.5;
            var figureMarginTop = (window.innerHeight - figureHeight) / 2;

            figure
                .style("height", figureHeight + "px")
                .style("top", figureMarginTop + "px");


            // 3. tell scrollama to update new element dimensions
            // scroller.resize();
        }

        // scrollama event handlers
        function handleStepEnter(response) {

            // var centerElement = document.querySelector("[center-step ='" + `${response.index}` + "']");

            currentElement = d3.selectAll("[center-step ='" + `${response.index}` + "']");

            currentElement.classed("is-current", true);

            // add color to current step only
            step.classed("is-active", function (d, i) {
                return i === response.index;
            });

            var currentElement = document.querySelector("[data-step ='" + `${response.index}` + "']");

            currentElement.classList.remove("is-fading-out");
        }

        function handleStepExit(response) {
            console.log(response);
            // response = { element, direction, index }

            d3.select("[center-step ='" + `${response.index}` + "']").classed("is-current", false);


            // add color to current step only
            step.classed("is-fading-out", function (d, i) {
                return i === response.index;
            });

            var currentElement = document.querySelector("[data-step ='" + `${response.index}` + "']");

            currentElement.classList.remove("is-active");
        }

        function handleStepProgress(response) {
            console.log(response);

            let opacity;

            // Defining the current element;
            currentElement = d3.selectAll("[center-step ='" + `${response.index}` + "']");
            allElements = d3.selectAll("#contentScroll:not([center-step ='" + `${response.index}` + "'])");

            currentElement.classed("is-current", true);
            allElements.classed("is-current", false);

            if (response.progress <= 0.33) {

                // Fade in: from 0 to 1 over the first 33%
                opacity = (response.progress) * 3;

                // opacity = 1;

            } else if (response.progress > 0.33 & response.progress < 0.66) {

                // Stay at opacity 1 between 33% and 66%
                opacity = 1;

            } else {
                // Fade out: from 1 to 0 over the last 33%
                opacity = 3 - response.progress * 3;
                // opacity = 1;

            }

            // if (response.progress > 1) {
            //     currentElement.classed("is-current", false);
            // } else if (response.progress < 0) {
            //     currentElement.classed("is-current", false);
            // } else {
            //     currentElement.classed("is-current", true);
            // }

            currentElement.style("opacity", opacity);
        }

        function init() {

            // Setup resize event listener
            window.addEventListener("resize", handleResize);

            // 1. force a resize on load to ensure proper dimensions are sent to scrollama
            handleResize();

            // window.addEventListener("resize", handleResize);

            // 2. setup the scroller passing options
            // 		this will also initialize trigger observations
            // 3. bind scrollama event handlers (this can be chained like below)
            scroller
                .setup({
                    step: "#scrolly article .step",
                    offset: 0.5,
                    progress: true,
                    debug: false
                })
                // .onStepEnter(handleStepEnter)
                // .onStepExit(handleStepExit);
                .onStepProgress(handleStepProgress);
        }

        // kick things off
        init();
    </script>

    <div class="debug-crosshair"></div>


</body>
